name: Security

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .gitleaksignore
      - .github/workflows/**
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependencies, secrets, static analysis and workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the scanners
        env:
          GITLEAKS_VERSION: 8.30.1
          OSV_SCANNER_VERSION: 2.7.0
          SEMGREP_VERSION: 1.183.0
          ZIZMOR_VERSION: 1.31.1
          GOVULNCHECK_VERSION: 1.9.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          curl -sSfL -o /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
          pipx install "semgrep==${SEMGREP_VERSION}"
          pipx install "zizmor==${ZIZMOR_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@v${GOVULNCHECK_VERSION}"

      - name: Audit the Go dependencies (govulncheck)
        run: govulncheck ./...

      - name: Audit the Go dependencies (OSV-Scanner)
        if: ${{ !cancelled() }}
        run: osv-scanner scan source --lockfile go.mod

      - name: Scan git history for committed secrets
        if: ${{ !cancelled() }}
        run: gitleaks git --redact --verbose --no-banner .

      - name: Scan the sources (Semgrep)
        if: ${{ !cancelled() }}
        run: semgrep scan --config p/golang --metrics=off --error --exclude sdk --exclude tests

      - name: Audit the workflows (zizmor)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/workflows
